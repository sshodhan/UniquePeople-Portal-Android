<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scan QR Code</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #05070b;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #preview {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #05070b;
    }
    .shade {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.68), rgba(0,0,0,0.06) 32%, rgba(0,0,0,0.64));
      pointer-events: none;
    }
    .panel {
      position: fixed;
      left: 104px;
      right: 104px;
      bottom: 42px;
      padding: 22px 28px;
      border-radius: 8px;
      background: rgba(11, 15, 23, 0.82);
      box-shadow: 0 16px 46px rgba(0,0,0,0.44);
      backdrop-filter: blur(8px);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 650;
    }
    p {
      margin: 0;
      color: #c8d1df;
      font-size: 19px;
      line-height: 1.38;
    }
    #status {
      color: #fff;
    }
    #result {
      margin-top: 12px;
      color: #8ff2d5;
      word-break: break-all;
    }
    .target {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 34vh;
      height: 34vh;
      max-width: 360px;
      max-height: 360px;
      min-width: 220px;
      min-height: 220px;
      transform: translate(-50%, -50%);
      border: 4px solid rgba(255,255,255,0.86);
      border-radius: 8px;
      box-shadow: 0 0 0 999px rgba(0,0,0,0.24);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <video id="preview" autoplay muted playsinline></video>
  <div class="shade"></div>
  <div class="target"></div>
  <section class="panel">
    <h1>Scan Album QR Code</h1>
    <p id="status">Starting camera...</p>
    <p id="result"></p>
  </section>
  <script src="qr-scan.js"></script>
</body>
</html>
